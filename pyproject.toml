[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiforensics"
version = "0.1.0"
description = "Identify which AI coding agent sent an LLM API request, from the request alone."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
aiforensics = "aiforensics.cli:main"

[tool.setuptools.packages.find]
include = ["aiforensics*"]
